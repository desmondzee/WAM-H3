[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wam-h3"
version = "0.1.0"
description = "World Action Model on MiniMax-H3"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.10.0",
  "torchvision==0.25.0",
  "transformers==4.57.3",
  "accelerate==1.14.0",
  "peft==0.20.0",
  "safetensors==0.7.0",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "numpy>=1.26,<3",
  "einops>=0.8",
  "datasets>=3.6,<4",
  "pyarrow>=17",
  "pandas>=2.2",
  "av>=14",
  "imageio>=2.37",
  "imageio-ffmpeg>=0.6",
  "pillow>=10",
  "jsonlines>=4",
  "boto3>=1.35",
  "termcolor>=2.5",
  "rich>=13",
  "tqdm>=4.66",
  "pyyaml>=6",
  "huggingface-hub>=0.29",
  "gitpython>=3.1",
  "tensorboard>=2.17",
  "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["wam_h3*"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
