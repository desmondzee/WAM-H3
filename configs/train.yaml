defaults:
  - _self_
  - data: libero_2cam
  - model: wamh3
  - task: libero_wamh3_dev

task_name: default
output_dir: ./runs/${task_name}/${now:%Y%m%d_%H%M%S}
seed: 42

train:
  batch_size: 16
  grad_accum: 1
  num_workers: 8
  lr: 1e-4
  weight_decay: 1e-2
  betas: [0.9, 0.95]
  warmup_ratio: 0.05
  min_lr_ratio: 0.01
  max_grad_norm: 1.0
  num_epochs: 10
  max_steps: null
  save_every: 2000
  log_every: 10
  resume: null

eval_num_inference_steps: 10

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
